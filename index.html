
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه اجاره NFT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 15px; }
        h1 { text-align: center; font-size: 20px; margin-bottom: 20px; color: #38bdf8; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .card { background: #1e293b; border-radius: 12px; padding: 10px; text-align: center; border: 1px solid #334155; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .title { font-size: 14px; font-weight: bold; margin: 8px 0; }
        .price { font-size: 13px; color: #38bdf8; margin-bottom: 10px; }
        .btn { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; }
        .btn:active { background: #0369a1; }
    </style>
</head>
<body>
    <h1>فروشگاه اجاره آنلاین</h1>
    <div class="grid" id="product-grid">
        <div class="card">
            <div class="title">Perfume Bottle #3721</div>
            <div class="price">اجاره روزانه: 0.06 TON</div>
            <button class="btn" onclick="alert('ارتباط با کیف پول...')">اجاره کنید</button>
        </div>
        <div class="card">
            <div class="title">Restless Jar #295</div>
            <div class="price">اجاره روزانه: 0.03 TON</div>
            <button class="btn" onclick="alert('ارتباط با کیف پول...')">اجاره کنید</button>
        </div>
    </div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
