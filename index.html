<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه من</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }
        .title {
            font-size: 14px;
            margin: 10px 0 5px;
            font-weight: bold;
        }
        .price {
            color: #38bdf8;
            font-size: 13px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>فروشگاه اختصاصی من</h2>
    
    <div class="grid">
        <div class="card">
            <img src="https://picsum.photos/200/200?random=1" alt="محصول">
            <div class="title">آیتم شماره ۱</div>
            <div class="price">قیمت: 0.01 TON</div>
            <button class="btn" onclick="buyItem('آیتم ۱')">خرید</button>
        </div>
        <div class="card">
            <img src="https://picsum.photos/200/200?random=2" alt="محصول">
            <div class="title">آیتم شماره ۲</div>
            <div class="price">قیمت: 0.02 TON</div>
            <button class="btn" onclick="buyItem('آیتم ۲')">خرید</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function buyItem(itemName) {
            alert('شما روی خرید ' + itemName + ' زدید!');
        }
    </script>
</body>
</html>
