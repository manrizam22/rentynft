
    <!DOCTYPE html>
    <html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>مارکت اجاره NFT</title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <style>
            body { font-family: Tahoma, sans-serif; background-color: #0b0f19; color: #fff; margin: 0; padding: 12px; }
            .header { display: flex; justify-content: space-between; align-items: center; background: #161e2e; padding: 12px 16px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #283548; }
            .title-header { font-size: 16px; font-weight: bold; color: #f8fafc; }
            .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .card { background: #161e2e; border-radius: 14px; padding: 10px; border: 1px solid #283548; text-align: center; display: flex; flexDirection: column; justify-content: space-between; }
            .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; }
            .title { font-size: 13px; font-weight: bold; color: #f8fafc; margin-bottom: 5px; }
            .price { font-size: 12px; color: #38bdf8; margin-bottom: 10px; }
            .btn { background: #2563eb; color: white; text-decoration: none; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: bold; display: block; text-align: center; }
            .btn:active { background: #1d4ed8; }
        </style>
    </head>
    <body>
        <div class="header">
            <span class="title-header">مارکت اجاره NFT</span>
            <span style="background: #1e3a8a; color: #93c5fd; padding: 4px 10px; border-radius: 20px; font-size: 11px;">بروز شده زنده</span>
        </div>
        <div class="grid">
            <p style='text-align:center; color:#94a3b8;'>در حال حاضر محصولی یافت نشد.</p>
        </div>
        <script>window.Telegram.WebApp.expand();</script>
    </body>
    </html>
