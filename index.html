
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویژه عطا فتحی</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 40px 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90vh;
        }
        .clowns {
            font-size: 45px;
            margin: 15px 0;
            animation: bounce 0.8s infinite alternate;
        }
        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        .box {
            font-size: 32px;
            font-weight: bold;
            color: #f87171;
            background: #161e2e;
            padding: 30px 20px;
            border-radius: 20px;
            border: 3px dashed #ef4444;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            line-height: 1.8;
        }
        .footer {
            margin-top: 20px;
            font-size: 16px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="clowns">🤡 🎪 🤡 🎪 🤡</div>
    
    <div class="box">
        عطا فتحی<br>
        خاک تو سرت به درد نخور! 🎭
    </div>

    <div class="clowns">🎈 🤡 🚗 🤡 🎈</div>
    
    <div class="footer">تقدیم با عشق و افتخار 😂❤️</div>
</body>
</html>
